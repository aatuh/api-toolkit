image:
  repository: example/api
  tag: latest

secretName: api-toolkit-secrets

api:
  replicas: 2
  port: 8080
  livez: /livez
  readyz: /readyz

adminService:
  enabled: true
  port: 9090

worker:
  replicas: 1

migration:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  minReplicas: 2
  maxReplicas: 10
