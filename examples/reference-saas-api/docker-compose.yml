services:
  api:
    build: .
    ports:
      - "8080:8080"
      - "9090:9090"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://api:api@postgres:5432/api?sslmode=disable
      REDIS_ADDR: redis:6379
      RATE_LIMIT_STORE: redis
      IDEMPOTENCY_STORE: redis
      ADMIN_ADDR: :9090
      ASYNC_WORKER_ENABLED: "false"
      WEBHOOK_SECRET_KEY: local-webhook-secret-key-1234567
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  migrate:
    build: .
    entrypoint: ["/migrate"]
    command: ["-dir", "/migrations", "up"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://api:api@postgres:5432/api?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build: .
    entrypoint: ["/worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://api:api@postgres:5432/api?sslmode=disable
      REDIS_ADDR: redis:6379
      WEBHOOK_SECRET_KEY: local-webhook-secret-key-1234567
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: api
      POSTGRES_PASSWORD: api
      POSTGRES_DB: api
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api -d api"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    profiles: [objectstore]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
  minio-init:
    image: minio/mc:latest
    profiles: [objectstore]
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minio minio123 &&
      mc mb --ignore-existing local/api-objects"

volumes:
  postgres-data:
  redis-data:
  minio-data:
