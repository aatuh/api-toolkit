version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/contrib"
    schedule:
      interval: "weekly"
  # Keeps SHA-pinned workflow actions current; review docs/governance.md's
  # Action Pin Refresh Policy before merging a generated Dependabot PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
