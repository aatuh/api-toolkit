name: nightly

on:
  schedule:
    - cron: "43 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOWORK: off

jobs:
  provider-sandbox:
    name: provider-sandbox
    runs-on: ubuntu-latest
    environment: provider-sandbox
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_SANDBOX_API_KEY }}
      CLERK_JWKS_URL: ${{ secrets.CLERK_SANDBOX_JWKS_URL }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # actions/setup-go v6.4.0
        with:
          go-version: 1.26.x
          check-latest: true
      - name: Record provider sandbox evidence
        run: RUN_PROVIDER_LIVE_CHECKS=true make provider-live-check
      - name: Upload sanitized provider evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        with:
          name: provider-live-evidence-${{ github.run_id }}
          path: .ci-result/provider-live/evidence.json
          if-no-files-found: error
          retention-days: 90
  deep-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # actions/setup-go v6.4.0
        with:
          go-version: 1.26.x
          check-latest: true
      - name: Longer fuzz
        run: FUZZTIME=60s make fuzz
      - name: Generated scaffold integration
        run: make generated-integration-check
      - name: Generated full-profile soak
        run: GENERATED_SOAK_DURATION_SECONDS=300 GENERATED_SOAK_INTEGRATION_CYCLES=3 make generated-soak-check
      - name: Generated failure integration
        run: make generated-failure-check
      - name: Upload generated failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        with:
          name: nightly-generated-failure-${{ github.run_id }}
          path: .ci-result/generated-failure/
          if-no-files-found: warn
          retention-days: 7
      - name: Dependency vulnerability checks
        run: make vuln
      - name: Benchmark allocation review
        continue-on-error: true
        run: make benchmark-check
      - name: Upload benchmark allocation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        with:
          name: benchmark-allocation-evidence-${{ github.run_id }}
          path: .ci-result/benchmark-check/
          if-no-files-found: error
          retention-days: 90
