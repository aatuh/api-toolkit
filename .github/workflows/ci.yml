name: ci

on:
  push:
    branches: [master]
  pull_request:

# Pull requests are validated by their pull_request event; pushes run only after
# a change reaches the default branch. This avoids duplicate check names for a
# single commit and makes required-check evaluation unambiguous.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout v7.0.0
      - name: Validate conventional pull-request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: make pr-title-check
  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.25.x, 1.26.x]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # actions/setup-go v6.4.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: Verify root and contrib modules
        run: |
          GOWORK=off go mod verify
          (cd contrib && GOWORK=off go mod verify)
      - name: Build root and contrib modules
        run: make ci-build-smoke
      - name: Unit tests and coverage
        run: make coverage-check
      - name: Example compile gate
        run: make example-compile-check
      - name: Coverage summary
        if: always()
        run: |
          if [ -s .ci-result/coverage/summary.md ]; then
            cat .ci-result/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Race tests
        run: make test-race
      - name: govulncheck
        run: make vuln
      - name: Dependency footprint report
        run: make dependency-report
  postgres-contract:
    name: postgres-contract (18)
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      POSTGRES_TEST_DSN: postgres://api_toolkit_test:api_toolkit_test@127.0.0.1:54329/api_toolkit_test?sslmode=disable
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: api_toolkit_test
          POSTGRES_PASSWORD: api_toolkit_test
          POSTGRES_DB: api_toolkit_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U api_toolkit_test -d api_toolkit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # actions/setup-go v6.4.0
        with:
          go-version: 1.26.x
          check-latest: true
      - name: Real PostgreSQL contract harness
        run: |
          make test-postgres
          make supported-adapter-check
  redis-contract:
    name: redis-contract (7)
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      REDIS_TEST_URL: redis://127.0.0.1:56379/15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # actions/setup-go v6.4.0
        with:
          go-version: 1.26.x
          check-latest: true
      - name: Real Redis contract harness
        run: |
          make test-redis
          make supported-adapter-check
  platform-core:
    name: platform-core (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-14
          - platform: windows-amd64
            runner: windows-2022
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # actions/setup-go v6.4.0
        with:
          go-version: 1.26.x
          check-latest: true
      - name: Root module build
        run: go build ./...
      - name: Root module tests
        run: go test ./...
      - name: Root examples
        run: go test ./... -run '^Example'
      - name: Generate portable service fixture
        id: fixture
        shell: pwsh
        working-directory: contrib
        run: |
          $serviceDir = Join-Path $env:RUNNER_TEMP "api-toolkit-platform-${{ matrix.platform }}"
          $contribDir = Join-Path $env:GITHUB_WORKSPACE "contrib"
          go run ./cmd/api-toolkit new service `
            --module example.com/platform-smoke `
            --profile saas-api `
            --dir "$serviceDir" `
            --core-replace "$env:GITHUB_WORKSPACE" `
            --contrib-replace "$contribDir"
          "directory=$serviceDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Generated service build
        working-directory: ${{ steps.fixture.outputs.directory }}
        run: go build ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # actions/setup-go v6.4.0
        with:
          go-version: 1.26.x
          check-latest: true
      - name: Lint
        run: make lint
  governance:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # actions/setup-go v6.4.0
        with:
          go-version: 1.26.x
          check-latest: true
      - name: Dependency boundary governance
        run: make dependency-boundary-check
      - name: Documentation governance
        run: make docs-check
      - name: V3 readiness governance
        run: make v3-readiness-check
      - name: Fetch pull request base for contrib release notes
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
      - name: Contrib release-note check (pull request base)
        if: github.event_name == 'pull_request'
        env:
          CONTRIB_RELEASE_BASE_REF: origin/${{ github.base_ref }}
        run: make contrib-release-notes-check
      - name: Contrib API drift gate (pull request base)
        if: github.event_name == 'pull_request'
        env:
          API_BASE_REF: origin/${{ github.base_ref }}
        run: make contrib-api-drift-report
  api-check:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.25.x, 1.26.x]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # actions/setup-go v6.4.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: API compatibility check (pull request base)
        if: github.event_name == 'pull_request'
        env:
          API_BASE_REF: origin/${{ github.base_ref }}
        run: |
          git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
          make release-api-check
      - name: API additions are forever gate (pull request base)
        if: github.event_name == 'pull_request'
        env:
          API_ADDITIONS_BASE_REF: origin/${{ github.base_ref }}
        run: make api-additions-check
      - name: API compatibility check (push previous commit)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          API_BASE_REF: ${{ github.event.before }}
        run: make release-api-check
      - name: API additions are forever gate (push previous commit)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          API_ADDITIONS_BASE_REF: ${{ github.event.before }}
        run: make api-additions-check
      - name: API compatibility check (initial push)
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: echo "Skipping API compatibility check because this push has no previous commit baseline."
      - name: Downstream upgrade smoke
        env:
          UPGRADE_SMOKE_BASE_REF: v3.1.2
        run: make upgrade-smoke-check
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # actions/setup-go v6.4.0
        with:
          go-version: 1.26.x
          check-latest: true
      - name: Fuzz smoke
        run: make fuzz
      - name: Upload minimized fuzz corpus
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        with:
          name: fuzz-corpus-${{ github.run_id }}
          path: |
            binding/testdata/fuzz/
            queryparams/testdata/fuzz/
            negotiation/testdata/fuzz/
            upload/testdata/fuzz/
            webhooks/testdata/fuzz/
            httpx/identity/testdata/fuzz/
            middleware/idempotency/testdata/fuzz/
            contrib/middleware/openapi/testdata/fuzz/
          if-no-files-found: warn
          retention-days: 7
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # actions/setup-go v6.4.0
        with:
          go-version: 1.26.x
          check-latest: true
      - name: Required mutation gate
        run: make mutation-check
      - name: Upload mutation report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        with:
          name: mutation-check-${{ github.run_id }}
          path: .ci-result/mutation/mutation-check.tsv
          if-no-files-found: error
          retention-days: 7
