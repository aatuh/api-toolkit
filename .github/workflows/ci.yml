name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.25.x]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # actions/setup-go v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: Unit tests and coverage
        run: make coverage-check
      - name: Race tests
        run: make test-race
      - name: govulncheck
        run: make vuln
  toolchain-local:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # actions/setup-go v5
        with:
          go-version: 1.25.x
          check-latest: true
      - name: Build and test (local toolchain only)
        run: make test
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # actions/setup-go v5
        with:
          go-version: 1.25.x
          check-latest: true
      - name: Lint
        run: make lint
  governance:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # actions/setup-go v5
        with:
          go-version: 1.25.x
          check-latest: true
      - name: Documentation governance
        run: make docs-check
      - name: Fetch pull request base for contrib release notes
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
      - name: Contrib release-note check (pull request base)
        if: github.event_name == 'pull_request'
        env:
          CONTRIB_RELEASE_BASE_REF: origin/${{ github.base_ref }}
        run: make contrib-release-notes-check
  api-check:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # actions/setup-go v5
        with:
          go-version: 1.25.x
          check-latest: true
      - name: API compatibility check (pull request base)
        if: github.event_name == 'pull_request'
        env:
          API_BASE_REF: origin/${{ github.base_ref }}
        run: |
          git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
          make release-api-check
      - name: API compatibility check (push previous commit)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          API_BASE_REF: ${{ github.event.before }}
        run: make release-api-check
      - name: API compatibility check (initial push)
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: echo "Skipping API compatibility check because this push has no previous commit baseline."
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # actions/setup-go v5
        with:
          go-version: 1.25.x
          check-latest: true
      - name: Fuzz smoke
        run: make fuzz
