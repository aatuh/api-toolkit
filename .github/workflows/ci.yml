name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.25.x]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # actions/setup-go v6.4.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: Unit tests and coverage
        run: make coverage-check
      - name: Example compile gate
        run: make example-compile-check
      - name: Coverage summary
        if: always()
        run: |
          if [ -s .ci-result/coverage/summary.md ]; then
            cat .ci-result/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Race tests
        run: make test-race
      - name: govulncheck
        run: make vuln
      - name: Dependency footprint report
        run: make dependency-report
  toolchain-local:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # actions/setup-go v6.4.0
        with:
          go-version: 1.25.x
          check-latest: true
      - name: Build and test (local toolchain only)
        run: make test
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # actions/setup-go v6.4.0
        with:
          go-version: 1.25.x
          check-latest: true
      - name: Lint
        run: make lint
  governance:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # actions/setup-go v6.4.0
        with:
          go-version: 1.25.x
          check-latest: true
      - name: Dependency boundary governance
        run: make dependency-boundary-check
      - name: Documentation governance
        run: make docs-check
      - name: V3 readiness governance
        run: make v3-readiness-check
      - name: Fetch pull request base for contrib release notes
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
      - name: Contrib release-note check (pull request base)
        if: github.event_name == 'pull_request'
        env:
          CONTRIB_RELEASE_BASE_REF: origin/${{ github.base_ref }}
        run: make contrib-release-notes-check
      - name: Contrib API drift gate (pull request base)
        if: github.event_name == 'pull_request'
        env:
          API_BASE_REF: origin/${{ github.base_ref }}
        run: make contrib-api-drift-report
  api-check:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # actions/setup-go v6.4.0
        with:
          go-version: 1.25.x
          check-latest: true
      - name: API compatibility check (pull request base)
        if: github.event_name == 'pull_request'
        env:
          API_BASE_REF: origin/${{ github.base_ref }}
        run: |
          git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
          make release-api-check
      - name: API additions are forever gate (pull request base)
        if: github.event_name == 'pull_request'
        env:
          API_ADDITIONS_BASE_REF: origin/${{ github.base_ref }}
        run: make api-additions-check
      - name: API compatibility check (push previous commit)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          API_BASE_REF: ${{ github.event.before }}
        run: make release-api-check
      - name: API additions are forever gate (push previous commit)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          API_ADDITIONS_BASE_REF: ${{ github.event.before }}
        run: make api-additions-check
      - name: API compatibility check (initial push)
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: echo "Skipping API compatibility check because this push has no previous commit baseline."
      - name: Downstream upgrade smoke
        env:
          UPGRADE_SMOKE_BASE_REF: v3.1.2
        run: make upgrade-smoke-check
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # actions/setup-go v6.4.0
        with:
          go-version: 1.25.x
          check-latest: true
      - name: Fuzz smoke
        run: make fuzz
