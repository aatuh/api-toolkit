name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  attestations: write
  contents: write
  id-token: write

env:
  API_BASE_REF: v3.1.2
  GOTOOLCHAIN: local
  COSIGN_CERTIFICATE_IDENTITY_REGEXP: '^https://github.com/aatuh/api-toolkit/\.github/workflows/release\.yml@refs/tags/v.*$'
  COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # actions/setup-go v6.4.0
        with:
          go-version: 1.25.x
          check-latest: true

      - name: Classify release tag
        id: release_kind
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.0-rc\.[0-9]+$ ]]; then
            echo "release_kind=release-candidate" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_kind=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported release tag $tag; use vX.Y.Z or vX.Y.0-rc.N." >&2
            exit 2
          fi

      - name: Generate clean publication evidence
        run: make release-evidence

      - name: Print release reviewer summary before artifact verification
        run: RELEASE_SUMMARY=release-check-summary.json make release-review-summary

      - name: Verify release evidence logs archive
        run: test -s .ci-result/release-evidence/release-evidence-logs.tgz

      - name: Generate SBOM (root)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # anchore/sbom-action v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-root.spdx.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (contrib)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # anchore/sbom-action v0
        with:
          path: contrib
          format: spdx-json
          output-file: sbom-contrib.spdx.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          upload-artifact: false
          upload-release-assets: false

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # sigstore/cosign-installer v3

      - name: Sign SBOMs (keyless, GitHub OIDC)
        run: |
          cosign sign-blob --yes \
            --output-signature sbom-root.spdx.json.sig \
            --output-certificate sbom-root.spdx.json.pem \
            sbom-root.spdx.json
          cosign sign-blob --yes \
            --output-signature sbom-contrib.spdx.json.sig \
            --output-certificate sbom-contrib.spdx.json.pem \
            sbom-contrib.spdx.json

      - name: Verify SBOM signatures
        run: |
          cosign verify-blob \
            --certificate sbom-root.spdx.json.pem \
            --signature sbom-root.spdx.json.sig \
            --certificate-identity-regexp "$COSIGN_CERTIFICATE_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$COSIGN_CERTIFICATE_OIDC_ISSUER" \
            sbom-root.spdx.json
          cosign verify-blob \
            --certificate sbom-contrib.spdx.json.pem \
            --signature sbom-contrib.spdx.json.sig \
            --certificate-identity-regexp "$COSIGN_CERTIFICATE_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$COSIGN_CERTIFICATE_OIDC_ISSUER" \
            sbom-contrib.spdx.json

      - name: Record release asset checksums
        run: |
          cp .ci-result/release-evidence/release-evidence-logs.tgz release-evidence-logs.tgz
          sha256sum \
            release-check-summary.json \
            release-evidence-logs.tgz \
            sbom-root.spdx.json \
            sbom-contrib.spdx.json \
            sbom-root.spdx.json.sig \
            sbom-root.spdx.json.pem \
            sbom-contrib.spdx.json.sig \
            sbom-contrib.spdx.json.pem > release-asset-manifest.tsv

      - name: Verify release artifact bundle
        run: RELEASE_ARTIFACT_VERIFY_MODE=local make release-artifact-verify

      - name: Upload evidence and assets to draft release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # softprops/action-gh-release v3.0.0
        with:
          draft: true
          prerelease: ${{ steps.release_kind.outputs.prerelease }}
          fail_on_unmatched_files: true
          body: |
            Release kind: ${{ steps.release_kind.outputs.release_kind }}.

            Release candidates use `vX.Y.0-rc.N` tags and are marked as GitHub prereleases. Promote only by tagging the final stable `vX.Y.0` after clean release evidence and release review.
          files: |
            release-check-summary.json
            release-evidence-logs.tgz
            release-asset-manifest.tsv
            sbom-root.spdx.json
            sbom-contrib.spdx.json
            sbom-root.spdx.json.sig
            sbom-root.spdx.json.pem
            sbom-contrib.spdx.json.sig
            sbom-contrib.spdx.json.pem

      - name: Attest provenance (release assets)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # actions/attest-build-provenance v4.1.0
        with:
          subject-path: |
            release-check-summary.json
            release-evidence-logs.tgz
            release-asset-manifest.tsv
            sbom-root.spdx.json
            sbom-contrib.spdx.json
            sbom-root.spdx.json.sig
            sbom-root.spdx.json.pem
            sbom-contrib.spdx.json.sig
            sbom-contrib.spdx.json.pem

      - name: Download and verify uploaded draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          download_dir="$(mktemp -d)"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$download_dir" \
            --clobber
          RELEASE_ASSET_DIR="$download_dir" \
            RELEASE_ARTIFACT_VERIFY_MODE=publication \
            RELEASE_TAG="$GITHUB_REF_NAME" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            make release-artifact-verify
