name: cli-release

on:
  push:
    tags:
      - 'cmd/api-toolkit/v5.*'

permissions:
  contents: read

jobs:
  verify-cli-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # actions/setup-go v6.4.0
        with:
          go-version: 1.26.x
          check-latest: true
      - name: Verify independent CLI module
        run: |
          cd cmd/api-toolkit
          GOWORK=off go mod verify
          GOWORK=off go test ./...
          GOWORK=off go build -trimpath -o "$RUNNER_TEMP/api-toolkit" .
          "$RUNNER_TEMP/api-toolkit" version --json
      - name: Retain verified CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: api-toolkit-${{ github.ref_name }}-linux-amd64
          path: ${{ runner.temp }}/api-toolkit
          retention-days: 30
