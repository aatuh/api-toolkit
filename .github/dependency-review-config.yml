vulnerability-check: true
license-check: true
warn-only: false
fail-on-severity: high
fail-on-scopes:
  - runtime
  - development
  - unknown
comment-summary-in-pr: never
show-openssf-scorecard: true
allow-licenses:
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - MIT
  - MPL-2.0
  - BlueOak-1.0.0
  - Unlicense
# These version-pinned Go modules carry a BSD-3-Clause LICENSE file, but the
# dependency-review metadata also adds a non-SPDX Google patent reference.
# Keep this exception package-scoped; see docs/license-policy.md.
allow-dependencies-licenses:
  - pkg:golang/golang.org/x/net@0.57.0
  - pkg:golang/golang.org/x/sync@0.22.0
  - pkg:golang/golang.org/x/sys@0.47.0
  - pkg:golang/golang.org/x/text@0.40.0
